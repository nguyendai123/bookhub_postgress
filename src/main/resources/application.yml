server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mariadb://localhost:3306/book_hub?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: "1232001"
    driver-class-name: org.mariadb.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
      pool-name: HikariCP

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true

  webflux:
    cors:
      allowed-origins: "https://taupe-licorice-bae4fb.netlify.app"

  jackson:
    serialization:
      fail-on-empty-beans: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: bookhub2526@gmail.com
    password: "ofqk deao wcae qgni"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

multipart:
  enabled: true

logging:
  level:
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.pool: DEBUG
    org:
      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

security:
  basic:
    enable: false
  ignored: "/**"

bookhub:
  app:
    jwtSecret: "======================bookHub=Spring==========================="
    jwtExpirationMs: 86400000

  recommendation:
    score:
      genre: 5.0
      author: 3.0
      history: 10.0
      highlight: 0.5
      same-language: 1.5

scheduler:
  hashtag:
    rate: 900000  # 15 minutes

behavior-log:
  workers: 1
  batch-size: 2

notification-push:
  workers: 1
  batch-size: 2
